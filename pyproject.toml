[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-assist"
version = "0.1.0"
description = "Production-oriented Kubernetes RAG assistant"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
    "qdrant-client>=1.13,<2.0",
    "rank-bm25>=0.2.2,<1.0",
    "sentence-transformers>=3.4,<6.0",
]

[tool.setuptools.packages.find]
where = ["src"]
